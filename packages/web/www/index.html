<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JuegoBoy</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #111;
      color: #DDDDDD;
      font: 14px system-ui, sans-serif;
    }

    #screen {
      width: min(640px, 100vw - 32px);
      aspect-ratio: 160 / 144;
      outline: none;
    }

    #screen:focus-visible { box-shadow: 0 0 0 2px #88c070; }

    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }

    .hint { color: #888; }

    button { min-height: 44px; padding: 0 16px; font: inherit; } /* comfortable tap targets */
  </style>
</head>

<body>
  <canvas id="screen"></canvas>

  <div class="row">
    <input id="rom" type="file" accept=".gb,.gbc,.bin">
    <button id="pause">Pause</button>
  </div>

  <div class="row">
    <button id="download-save">Download save</button>
    <button id="upload-save">Upload save</button>
    <!-- No accept filter: iOS greys out unknown extensions like .sav -->
    <input id="save" type="file" hidden>
  </div>

  <div id="status" class="hint" role="status"></div>

  <div class="hint">Click the screen to focus. D-pad: WASD · A: ↑ · B: ← · Start: → · Select: ↓</div>

  <script type="module">
    import { mount } from "./juegoboy.js";

    const gb = await mount(document.getElementById("screen"), {
      romInput: document.getElementById("rom"),
      saveInput: document.getElementById("save"),
    });

    const status = document.getElementById("status");
    const saveInput = document.getElementById("save");

    document.getElementById("download-save").addEventListener("click", () => {
      status.textContent = gb.downloadSave() ? "" : "No save data. Load a game that supports saving.";
    });
    document.getElementById("upload-save").addEventListener("click", () => saveInput.click());
    saveInput.addEventListener("saveimported", () => {
      status.textContent = "Save loaded. Game restarted.";
    });
    saveInput.addEventListener("saveerror", (e) => {
      status.textContent = `Couldn't load save: ${e.detail.message ?? e.detail}`;
    });

    const pauseButton = document.getElementById("pause");
    pauseButton.addEventListener("click", () => {
      gb.paused ? gb.resume() : gb.pause();
      pauseButton.textContent = gb.paused ? "Resume" : "Pause";
    });
  </script>
</body>
</html>
